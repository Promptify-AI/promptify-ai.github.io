<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - PromptifyAI</title>
    <style>
        :root {
            --bg: #09090b;
            --card: #18181b;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --accent: #6366f1;
            --border: #27272a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }
        nav {
            border-bottom: 1px solid var(--border);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
        }
        .logo { font-weight: 700; font-size: 1.3rem; color: var(--text); text-decoration: none; }
        .back-btn {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        .back-btn:hover { color: var(--text); border-color: var(--accent); }
        .container {
            max-width: 650px;
            margin: 3rem auto;
            padding: 2rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        p { color: var(--muted); margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: var(--text); }
        input, textarea {
            width: 100%;
            padding: 0.8rem;
            background: #09090b;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); }
        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }
        button:hover { opacity: 0.9; }
        .direct-email {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.95rem;
            text-align: center;
        }
        a { color: var(--accent); text-decoration: none; }
        footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">PromptifyAI</a>
        <a href="index.html" class="back-btn">← Back to Home</a>
    </nav>

    <div class="container">
        <h1>Contact Us</h1>
        <p>Have a question, bug report, or feedback about PromptifyAI? Fill out the form below or send us a direct email.</p>

        <form id="contactForm">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" required placeholder="Bug report / Feature request / Support">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="5" required placeholder="How can we help you?"></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>

        <div class="direct-email">
            <p>Or email us directly at: <a href="mailto:officialnotwinter@gmail.com">officialnotwinter@gmail.com</a></p>
        </div>
    </div>

    <footer>
        © 2026 PromptifyAI. All rights reserved.
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const subject = encodeURIComponent(document.getElementById('subject').value);
            const message = encodeURIComponent("From: " + name + "\n\n" + document.getElementById('message').value);
            window.location.href = `mailto:officialnotwinter@gmail.com?subject=${subject}&body=${message}`;
        });
    </script>

</body>
</html>
